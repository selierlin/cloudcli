<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CloudCLI UI</title>

    <!-- Fonts: Encode Sans is self-hosted (variable, latin subset) and loaded via
         @font-face in src/index.css, so no third-party font CDN is needed. -->
    <link rel="preload" href="/fonts/encode-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Launch splash: pure inline HTML/CSS so it paints before the JS bundle
         downloads. Covers the WebView blank screen while the front-end assets
         load (especially on a first connection), and is removed by the main.tsx
         once React has mounted. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0d10;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.25s ease;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      .splash-text {
        font-size: 15px;
        font-weight: 500;
      }
      .splash-sub {
        font-size: 12px;
        color: #9ca3af;
        max-width: 260px;
        text-align: center;
        line-height: 1.5;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude UI" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-spinner" role="status" aria-label="Loading"></div>
      <div class="splash-text">正在加载 CloudCLI 界面…</div>
      <div class="splash-sub" id="splash-sub">首次连接需下载前端资源，请稍候</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 在启动 splash 上显示当前连接的服务器名（Capacitor 原生存储，跨 origin 共享） -->
    <script>
      (function () {
        var sub = document.getElementById('splash-sub');
        if (!sub) return;
        var prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
        if (!prefs) return;
        prefs.get({ key: 'cloudcli.serverName' })
          .then(function (res) {
            var name = res && res.value ? res.value.trim() : '';
            if (name) sub.textContent = '正在连接 ' + name + '，首次加载请稍候';
          })
          .catch(function () {});
      })();
    </script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the iOS app icon render. The light pair is the static default;
         the script at the end of <head> swaps to the dark render when it resolves a
         dark start, and applyThemeChrome republishes on later appearance switches.
         A media-scoped pair is not used because Chrome ignores `media` on favicon
         links and would pin one variant for both appearances. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-light-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CloudCLI UI</title>

    <!-- Fonts: Encode Sans is self-hosted (variable, latin subset) and loaded via
         @font-face in src/index.css, so no third-party font CDN is needed. -->
    <link rel="preload" href="/fonts/encode-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Launch splash: pure inline HTML/CSS so it paints before the JS bundle
         downloads. Covers the WebView blank screen while the front-end assets
         load (especially on a first connection), and is removed by the main.tsx
         once React has mounted. -->
    <style>
      /* The splash paints before index.css and the JS bundle exist, so its colours
         are literals rather than tokens. The block below is the dark pair, which is
         also the fallback when the script at the end of <head> did not run. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0d10;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.25s ease;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      .splash-text {
        font-size: 15px;
        font-weight: 500;
      }
      .splash-sub {
        font-size: 12px;
        color: #9ca3af;
        max-width: 260px;
        text-align: center;
        line-height: 1.5;
      }
      /* Light appearance. The colours are the ones the light tokens resolve to
         (--background / --foreground / --muted-foreground), so the splash hands over
         to the first React paint without a jump in either direction. */
      :root[data-appearance='light'] #app-splash {
        background: #f7f6f3;
        color: #0d0b08;
      }
      :root[data-appearance='light'] .splash-spinner {
        border-color: rgba(0, 0, 0, 0.12);
        border-top-color: #15803d;
      }
      :root[data-appearance='light'] .splash-sub {
        color: #736f68;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude UI" />
    
    <!-- iOS Safari Icons. iOS masks the corners itself, so the file ships
         full-bleed rather than pre-rounded. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    
    <!-- Theme Color. These two media-scoped values are the declaration-only
         fallback; the script at the end of <head> removes them and writes one exact
         value once it has resolved the stored appearance, because a media query
         tracks the OS and not the in-app picker. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d10" />
    <!-- Windows tile colour, painted when the app is pinned and not while it runs:
         it cannot follow the appearance, so it stays a literal rather than a second
         source of truth. -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- First-paint appearance. The bundle that normally applies the theme has not
         been downloaded yet, so the splash and the browser chrome would otherwise
         contradict each other (a dark launch screen under a white status bar). This
         synchronous script resolves the appearance here instead and hands it to the
         two tags that need it. It reads the key ThemeContext reads first, so the
         stored in-app pick wins; when that key is absent it falls back to the OS
         preference, which is what the media scoped tags above track. The picker can
         also live in the synced preference store, which is only reachable once the
         bundle runs — a pick made on another device is corrected then, and so is the
         mismatch between a manual pick and the OS preference.

         `data-appearance` is not maintained after mount: React writes its own
         `data-theme` / `.dark` and re-publishes the chrome through applyThemeChrome,
         while the splash keeps the first-paint colours until ProtectedRoute dismisses
         it. Setting it was necessary because the splash outlives the first render. -->
    <script>
      (function () {
        var pref;
        try {
          pref = localStorage.getItem('theme');
        } catch (e) {
          // Storage can be blocked; fall through to the OS preference.
        }
        if (pref !== 'light' && pref !== 'dark') {
          pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }

        var root = document.documentElement;
        root.dataset.appearance = pref;
        root.style.colorScheme = pref;

        var colour = pref === 'dark' ? '#0b0d10' : '#f7f6f3';
        var stale = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < stale.length; i++) {
          stale[i].remove();
        }
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = colour;
        document.head.appendChild(meta);

        // The favicon mirrors the same resolution: the static link above is the
        // light render, so a dark start (from the stored pick or the OS) swaps it
        // before the browser has fetched the default.
        if (pref === 'dark') {
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) {
            icon.setAttribute('href', '/icons/favicon-dark-32.png');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-spinner" role="status" aria-label="Loading"></div>
      <div class="splash-text">正在加载 CloudCLI 界面…</div>
      <div class="splash-sub" id="splash-sub">首次连接需下载前端资源，请稍候</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 在启动 splash 上显示当前连接的服务器名（Capacitor 原生存储，跨 origin 共享） -->
    <script>
      (function () {
        var sub = document.getElementById('splash-sub');
        if (!sub) return;
        var prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
        if (!prefs) return;
        prefs.get({ key: 'cloudcli.serverName' })
          .then(function (res) {
            var name = res && res.value ? res.value.trim() : '';
            if (name) sub.textContent = '正在连接 ' + name + '，首次加载请稍候';
          })
          .catch(function () {});
      })();
    </script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
